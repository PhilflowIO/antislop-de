[project]
name = "antislop-de"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.0",
    "huggingface-hub>=1.18.0",
    "markdown>=3.7",
    "nltk>=3.9.4",
    "polars>=1.41.2",
    "pyarrow>=24.0.0",
    "regex>=2026.5.9",
    "spacy>=3.8.14",
    # spaCy-DE-Modell als echte Dependency (statt manuellem `spacy download`),
    # damit jede frische venv — auch im Worktree — den Struktur-Slop-Eval fahren
    # kann. Version zum spacy-3.8.x-Strang passend.
    "de-core-news-sm",
    "tqdm>=4.68.1",
    "wordfreq>=3.1.1",
]

[tool.uv.sources]
de-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl" }
